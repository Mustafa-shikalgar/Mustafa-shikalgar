<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="50%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3b4261" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bgGrad)" rx="20"/>
  <rect width="900" height="320" fill="url(#dots)" rx="20"/>

  <!-- Decorative corner brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#7aa2f7" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 860 20 L 880 20 L 880 40" stroke="#7dcfff" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 40 300 L 20 300 L 20 280" stroke="#9ece6a" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 880 280 L 880 300 L 860 300" stroke="#bb9af7" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Floating code snippets -->
  <text x="50" y="50" fill="#565f89" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" opacity="0.45">const dev = "Mustafa";</text>
  <text x="680" y="55" fill="#565f89" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" opacity="0.45">git push origin main</text>
  <text x="70" y="290" fill="#565f89" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" opacity="0.45">npm run dev</text>
  <text x="690" y="295" fill="#565f89" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" opacity="0.45">docker compose up</text>

  <!-- Laptop illustration (left side) -->
  <g transform="translate(70, 95)">
    <!-- Screen glow -->
    <rect x="-5" y="-5" width="170" height="110" rx="10" fill="#7aa2f7" opacity="0.08" filter="url(#softGlow)"/>
    <!-- Screen -->
    <rect x="0" y="0" width="160" height="100" rx="8" fill="url(#screenGrad)" stroke="#7aa2f7" stroke-width="1.5" opacity="0.9"/>
    <!-- Terminal dots -->
    <circle cx="15" cy="15" r="3" fill="#f7768e"/>
    <circle cx="27" cy="15" r="3" fill="#e0af68"/>
    <circle cx="39" cy="15" r="3" fill="#9ece6a"/>
    <!-- Code lines on screen -->
    <line x1="15" y1="35" x2="55" y2="35" stroke="#f7768e" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="48" x2="100" y2="48" stroke="#7aa2f7" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="61" x2="75" y2="61" stroke="#9ece6a" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="74" x2="115" y2="74" stroke="#e0af68" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="87" x2="85" y2="87" stroke="#7dcfff" stroke-width="3" stroke-linecap="round"/>
    <!-- Laptop base -->
    <path d="M -10 100 L 170 100 L 185 118 L -25 118 Z" fill="#2a2e3f" stroke="#7aa2f7" stroke-width="1.5" opacity="0.9"/>
    <!-- Trackpad line -->
    <line x1="55" y1="109" x2="105" y2="109" stroke="#565f89" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- AI/Backend theme icons (right side) -->
  <g transform="translate(740, 100)" opacity="0.85">
    <!-- Neural network nodes -->
    <circle cx="0" cy="0" r="5" fill="#7aa2f7" filter="url(#glow)"/>
    <circle cx="30" cy="-20" r="5" fill="#7dcfff" filter="url(#glow)"/>
    <circle cx="30" cy="20" r="5" fill="#9ece6a" filter="url(#glow)"/>
    <circle cx="60" cy="0" r="5" fill="#bb9af7" filter="url(#glow)"/>
    <!-- Connections -->
    <line x1="5" y1="0" x2="25" y2="-20" stroke="#7aa2f7" stroke-width="1" opacity="0.4"/>
    <line x1="5" y1="0" x2="25" y2="20" stroke="#7aa2f7" stroke-width="1" opacity="0.4"/>
    <line x1="35" y1="-20" x2="55" y2="0" stroke="#7dcfff" stroke-width="1" opacity="0.4"/>
    <line x1="35" y1="20" x2="55" y2="0" stroke="#9ece6a" stroke-width="1" opacity="0.4"/>
  </g>
  <g transform="translate(740, 160)" opacity="0.85">
    <!-- Server/Backend icon -->
    <rect x="0" y="0" width="60" height="15" rx="3" fill="#24283b" stroke="#7aa2f7" stroke-width="1.5"/>
    <circle cx="8" cy="7.5" r="2" fill="#9ece6a"/>
    <line x1="15" y1="7.5" x2="50" y2="7.5" stroke="#565f89" stroke-width="1.5"/>
    <rect x="0" y="20" width="60" height="15" rx="3" fill="#24283b" stroke="#7dcfff" stroke-width="1.5"/>
    <circle cx="8" cy="27.5" r="2" fill="#e0af68"/>
    <line x1="15" y1="27.5" x2="50" y2="27.5" stroke="#565f89" stroke-width="1.5"/>
  </g>

  <!-- Neon line -->
  <rect x="300" y="155" width="300" height="2" fill="url(#neonLine)"/>

  <!-- Name with glow -->
  <text x="450" y="140" fill="#7aa2f7" font-family="'Poppins','Segoe UI',sans-serif" font-size="40" font-weight="700" text-anchor="middle" filter="url(#glow)">Mustafa Shikalgar</text>

  <!-- Subtitle -->
  <text x="450" y="180" fill="#7dcfff" font-family="'Poppins','Segoe UI',sans-serif" font-size="20" text-anchor="middle" filter="url(#softGlow)">Software Engineer</text>

  <!-- Tagline -->
  <text x="450" y="215" fill="#9ece6a" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" text-anchor="middle" opacity="0.75">AI  •  Backend  •  FullStack</text>
</svg>