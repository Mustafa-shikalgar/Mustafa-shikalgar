<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" fill="none">
  <defs>
    <linearGradient id="pacBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <filter id="pacGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#pacBg)" rx="15"/>

  <!-- Title -->
  <text x="450" y="35" fill="#7aa2f7" font-family="'Poppins','Segoe UI',sans-serif" font-size="16" text-anchor="middle" font-weight="700">Pacman Eating Contributions</text>

  <!-- Contribution dots row -->
  <g transform="translate(0, 110)">
    <circle cx="180" cy="0" r="6" fill="#7aa2f7" filter="url(#dotGlow)">
      <animate attributeName="opacity" values="1;1;0;0" dur="5s" repeatCount="indefinite" keyTimes="0;0.12;0.14;1"/>
    </circle>
    <circle cx="280" cy="0" r="6" fill="#7dcfff" filter="url(#dotGlow)">
      <animate attributeName="opacity" values="1;1;0;0" dur="5s" repeatCount="indefinite" keyTimes="0;0.24;0.26;1"/>
    </circle>
    <circle cx="380" cy="0" r="6" fill="#9ece6a" filter="url(#dotGlow)">
      <animate attributeName="opacity" values="1;1;0;0" dur="5s" repeatCount="indefinite" keyTimes="0;0.36;0.38;1"/>
    </circle>
    <circle cx="480" cy="0" r="6" fill="#e0af68" filter="url(#dotGlow)">
      <animate attributeName="opacity" values="1;1;0;0" dur="5s" repeatCount="indefinite" keyTimes="0;0.48;0.5;1"/>
    </circle>
    <circle cx="580" cy="0" r="6" fill="#bb9af7" filter="url(#dotGlow)">
      <animate attributeName="opacity" values="1;1;0;0" dur="5s" repeatCount="indefinite" keyTimes="0;0.6;0.62;1"/>
    </circle>
    <circle cx="680" cy="0" r="6" fill="#f7768e" filter="url(#dotGlow)">
      <animate attributeName="opacity" values="1;1;0;0" dur="5s" repeatCount="indefinite" keyTimes="0;0.72;0.74;1"/>
    </circle>
    <circle cx="780" cy="0" r="6" fill="#7aa2f7" filter="url(#dotGlow)">
      <animate attributeName="opacity" values="1;1;0;0" dur="5s" repeatCount="indefinite" keyTimes="0;0.84;0.86;1"/>
    </circle>
  </g>

  <!-- Pacman -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="80 110; 830 110" dur="5s" repeatCount="indefinite"/>
    <path d="M 0 0 L 21.65 12.5 A 25 25 0 1 1 21.65 -12.5 Z" fill="#e0af68" filter="url(#pacGlow)">
      <animate attributeName="d" values="M 0 0 L 21.65 12.5 A 25 25 0 1 1 21.65 -12.5 Z;M 0 0 L 25 0 A 25 25 0 1 1 25 0 Z;M 0 0 L 21.65 12.5 A 25 25 0 1 1 21.65 -12.5 Z" dur="0.35s" repeatCount="indefinite"/>
    </path>
    <circle cx="2" cy="-12" r="3" fill="#1a1b26"/>
  </g>

  <!-- Ghost chasing Pacman -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="30 110; 780 110" dur="5s" repeatCount="indefinite"/>
    <path d="M 0 0 L 0 -18 A 18 18 0 0 1 36 -18 L 36 0 L 30 -6 L 24 0 L 18 -6 L 12 0 L 6 -6 Z" fill="#f7768e" opacity="0.85" filter="url(#pacGlow)"/>
    <circle cx="12" cy="-10" r="4" fill="#ffffff"/>
    <circle cx="24" cy="-10" r="4" fill="#ffffff"/>
    <circle cx="14" cy="-10" r="2" fill="#1a1b26"/>
    <circle cx="26" cy="-10" r="2" fill="#1a1b26"/>
  </g>

  <!-- Footer text -->
  <text x="450" y="195" fill="#565f89" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle" opacity="0.6">nom nom nom... eating those contributions</text>
</svg>